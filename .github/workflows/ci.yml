name: CI · Front-end

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  testes:
    name: Testes e cobertura
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Testes com cobertura
        run: npm run coverage

      - name: Resumo da cobertura
        if: always()
        run: node scripts/coverage-summary.mjs | tee resumo-cobertura.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comentar a cobertura no pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const corpo = fs.readFileSync('resumo-cobertura.md', 'utf8');
            const marcador = '<!-- twist-cobertura -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comentarios = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number },
            );
            const anterior = comentarios.find((c) => c.body?.includes(marcador));

            if (anterior) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: anterior.id, body: corpo,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: corpo,
              });
            }

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: coverage/
          retention-days: 30
